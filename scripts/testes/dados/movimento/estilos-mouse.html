<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>mesmo elemento: entra, reage ao mouse e volta</title>
<!-- Página nossa (teste da Parte 3b). O mesmo #cartao tem animação de entrada e transição de mouse (ida e volta).
     O gancho tem de guardar as ocorrências diferentes, não só somar "vezes". -->
<style>
  body { margin: 0; font: 16px sans-serif }
  @keyframes surge { from { opacity: 0 } to { opacity: 1 } }
  #cartao { position: absolute; left: 100px; top: 100px; width: 300px; height: 200px; background: #ccc;
    animation: surge 150ms ease-out; transition: transform 250ms ease-out }
  #cartao:hover { transform: translateY(-10px) }
</style>
</head>
<body>
<div id="cartao">cartão</div>
</body>
</html>
