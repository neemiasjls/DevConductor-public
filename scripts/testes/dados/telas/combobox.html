<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="base.css"><title>Combobox</title></head>
<body><main>
<h1>Pedido</h1>
<label for="cidade">Cidade</label>
<button id="cidade" type="button" role="combobox" aria-expanded="false" style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:240px;font-size:14px;border-color:#71717a"><span>Selecione a cidade</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="#71717a" fill="none"/></svg></button>
<label for="busca-cidade">Buscar cidade</label>
<input id="busca-cidade" type="text" role="combobox" aria-expanded="false" aria-autocomplete="list" style="width:240px;font-size:14px">
<label for="uf">Estado</label>
<select id="uf" style="font-size:14px"><option>SP</option><option>MG</option></select>
</main></body></html>
