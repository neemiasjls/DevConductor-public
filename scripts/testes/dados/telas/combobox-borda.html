<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="base.css"><title>Combobox</title></head>
<body><main>
<h1>Pedido</h1>
<label for="cidade">Cidade</label>
<button id="cidade" type="button" role="combobox" aria-expanded="false" style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:240px;border-color:#e4e4e7"><span>Selecione a cidade</span><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" stroke="#71717a" fill="none"/></svg></button>
<p id="obs-rotulo">Observação</p>
<div id="obs" contenteditable="true" role="textbox" aria-labelledby="obs-rotulo" style="min-height:44px;padding:8px 12px;border:1px solid #e4e4e7;border-radius:6px"></div>
</main></body></html>
